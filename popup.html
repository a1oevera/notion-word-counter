<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #fff;
        --fg: #37352f;
        --line: rgba(55, 53, 47, 0.09);
        --blue: #2383e2;
      }
      body.dark {
        --bg: #252525;
        --fg: rgba(255, 255, 255, 0.88);
        --line: rgba(255, 255, 255, 0.09);
      }
      body {
        margin: 0;
        width: 300px;
        padding: 14px 16px 12px;
        font: 13px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }
      .badge {
        font-size: 11px;
        font-weight: 500;
        color: var(--blue);
        background: rgba(35, 131, 226, 0.12);
        padding: 1px 6px;
        border-radius: 4px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr auto;
        column-gap: 16px;
        row-gap: 6px;
      }
      .label { opacity: 0.65; }
      .value {
        text-align: right;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      body.selecting .value { color: var(--blue); }
      .empty { opacity: 0.65; margin: 4px 0 0; }
      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        cursor: pointer;
      }
      .toggle input { margin: 0; accent-color: var(--blue); }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>Word count</h1>
      <span class="badge" id="badge" hidden>Selection</span>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden></p>
    <label class="toggle"><input type="checkbox" id="show" /> Show word count on Notion pages</label>
    <script src="popup.js"></script>
  </body>
</html>
